rebase_notes:
  - >-
    The SLO configuration fields were assigned to the current schedule config
    namespace, and validation was moved into the current serving validation hook.
  - >-
    The SLO initialization was combined with the current prefill-delayer setup;
    current MLX imports, config-bag access, and PrefillAdder arguments were kept.
  - >-
    The SLO profile KV lifecycle fix was retained. Its DSpark draft conflict was
    resolved by keeping the pack's graph metadata and non-padded-token handling.
  - >-
    The offline profile add/fix/revert sequence was omitted because its net diff
    is empty.
  - >-
    Old adaptive DSpark commits after the SLO series were omitted because the
    pack contains their newer equivalents. The compact prefill-plan race patch
    was also omitted because upstream contains the official #32467 fix.

