rebase_notes:
- The SLO configuration fields were assigned to the current schedule config namespace, and validation
  was moved into the current serving validation hook.
- The SLO initialization was combined with the current prefill-delayer setup; current MLX imports,
  config-bag access, and PrefillAdder arguments were kept.
- The SLO profile KV lifecycle fix was retained. Its DSpark draft conflict was resolved by keeping
  the pack's graph metadata and non-padded-token handling.
- The offline profile add/fix/revert sequence was omitted because its net diff is empty.
- 'Old adaptive DSpark commits after the SLO series were omitted because the pack contains their
  newer equivalents. The compact prefill-plan race patch was also omitted because upstream contains
  the official #32467 fix.'
- SLO synthetic requests update ReqKvInfo directly and are released through release_kv_cache with
  insertion disabled, so unified full/SWA and Mamba allocator state follows the same teardown path
  as production requests.
- '2026-09-14: updated by merging the refreshed pack, preserving all existing SLO patches and follow-up
  fixes. SLO fields moved to arg_groups/fields/schedule.py and scheduler reads use resolved config
  bags.'
- Kept the current scheduler stage decorator and sampling-mask abort handling; SLO decode timing
  records the actual accepted-token count. Kept normal-tensor DSA seed allocation and adopted upstream
  dsa_seed_topk_width. DSpark draft keeps its device lookup and upstream original_global_num_tokens_cpu.
- '2026-09-14 hang investigation: DP0 blocked in RaggedVerifyLayout._assemble while other ranks waited
  for decode copy_done. Uniform host lengths now use torch.full on device; variable CUDA host lengths
  use a fresh pinned CPU tensor and non_blocking upload. CPU metadata, token tiers and padding semantics
  are retained. The synchronization site is confirmed by py-spy; a DP/MoE/overlap collective wait
  cycle remains a hypothesis until GPU reproduction. Existing device-to-host budget/length fallback
  synchronizations are outside this patch.'
