rebase_notes:
- The 2026-09-07 rebuild consolidated the startup profiler follow-up fixes into b62ac30bb6.
- 'The old compact prefill-plan race commit was omitted because upstream/main contains the official
  #32467 resolution.'
- 'The old TP budget broadcast commit was omitted because the composition base contains the newer
  SpecTpSync-based implementation from PR #31195.'
- Batch-aware graph capture was adapted to preserve current main's DSA dual graphs, ragged layout
  staging, breakable graph events, and runtime config bags.
- '2026-09-14: merged the full PR #38897 head, retaining its upstream history and all existing adaptive
  commits. Migrated the three custom startup/graph-profile fields into arg_groups/fields/spec.py.
  The verify-all shortcut respects forced fractions and startup token-budget pins; the full-budget
  uniform optimization is retained. SGLANG_DSPARK_ENABLE_SPS_RECORD remains observability only.'
- '2026-09-14 hang investigation: DP0 blocked in RaggedVerifyLayout._assemble while other ranks waited
  for decode copy_done. Uniform host lengths now use torch.full on device; variable CUDA host lengths
  use a fresh pinned CPU tensor and non_blocking upload. CPU metadata, token tiers and padding semantics
  are retained. The synchronization site is confirmed by py-spy; a DP/MoE/overlap collective wait
  cycle remains a hypothesis until GPU reproduction. Existing device-to-host budget/length fallback
  synchronizations are outside this patch.'
